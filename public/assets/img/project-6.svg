<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#24211D"/>
  <!-- High Ceiling Windows & Duplex Mezzanine -->
  <rect x="40" y="40" width="200" height="200" fill="#B3C4CC" opacity="0.6"/>
  <line x1="140" y1="40" x2="140" y2="240" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="280" y="40" width="280" height="90" fill="#3D362F" rx="4"/>
  <line x1="280" y1="130" x2="560" y2="130" stroke="#B8860B" stroke-width="3"/>
  <!-- Chandelier -->
  <line x1="400" y1="40" x2="400" y2="160" stroke="#FFD8A8" stroke-width="2"/>
  <circle cx="400" cy="170" r="22" stroke="#FFD8A8" stroke-width="3" fill="none"/>
  <!-- Furniture -->
  <rect x="180" y="240" width="360" height="90" rx="8" fill="#5C5144"/>
  <rect x="200" y="220" width="100" height="50" rx="6" fill="#C8102E"/>
  <rect x="320" y="220" width="100" height="50" rx="6" fill="#8F8375"/>
  <rect x="440" y="220" width="80" height="50" rx="6" fill="#8F8375"/>
  <rect x="0" y="360" width="600" height="40" fill="#141210"/>
</svg>
