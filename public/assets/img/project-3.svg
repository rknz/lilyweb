<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#2E2824"/>
  <!-- Kitchen Window -->
  <rect x="180" y="40" width="240" height="110" fill="#A8BAC5" opacity="0.6"/>
  <line x1="300" y1="40" x2="300" y2="150" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Upper Cabinets -->
  <rect x="40" y="40" width="130" height="110" fill="#3D322B" rx="3"/>
  <rect x="430" y="40" width="130" height="110" fill="#3D322B" rx="3"/>
  <!-- Backsplash & LED Strip -->
  <rect x="40" y="150" width="520" height="50" fill="#241E1A"/>
  <line x1="40" y1="150" x2="560" y2="150" stroke="#FFE4B5" stroke-width="2"/>
  <!-- Countertop & Island -->
  <rect x="40" y="200" width="520" height="24" fill="#E8E2D8"/>
  <rect x="40" y="224" width="520" height="130" fill="#1F1813"/>
  <!-- Bar Stools -->
  <rect x="140" y="260" width="40" height="100" rx="3" fill="#8F0B20"/>
  <rect x="280" y="260" width="40" height="100" rx="3" fill="#8F0B20"/>
  <rect x="420" y="260" width="40" height="100" rx="3" fill="#8F0B20"/>
  <rect x="0" y="365" width="600" height="35" fill="#16120E"/>
</svg>
