<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" fill="none">
  <!-- Modern Ceramic Vases & Botanical Foliage -->
  <rect width="340" height="460" fill="transparent"/>
  
  <!-- Abstract framed canvas in background -->
  <rect x="80" y="30" width="220" height="340" rx="8" fill="#EBE5DC" stroke="#D9D0C3" stroke-width="2"/>
  <circle cx="190" cy="160" r="60" fill="#C8102E" opacity="0.7"/>
  <ellipse cx="190" cy="270" rx="70" ry="40" fill="#755E4C" opacity="0.4"/>

  <!-- Botanical branches -->
  <path d="M70 380 Q40 220 80 120" stroke="#7A6858" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="120" r="5" fill="#C8102E"/>
  <circle cx="65" cy="170" r="4" fill="#C8102E"/>
  <circle cx="50" cy="230" r="4" fill="#C8102E"/>

  <!-- Ceramic Tall Vase -->
  <path d="M50 380 Q45 280 65 240 L75 240 Q95 280 90 380 Z" fill="#D9D4CC" stroke="#C4BEB4" stroke-width="2"/>
  <ellipse cx="70" cy="240" rx="10" ry="4" fill="#C4BEB4"/>

  <!-- Round Ceramic Vessel -->
  <circle cx="140" cy="370" r="32" fill="#E8E2D8" stroke="#D5CEBE" stroke-width="2"/>
  <rect x="132" y="334" width="16" height="8" rx="2" fill="#D5CEBE"/>
</svg>
