<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#29231E"/>
  <!-- Modern Living Room Scene -->
  <rect x="40" y="40" width="520" height="220" fill="#3D332A" rx="8"/>
  <circle cx="300" cy="100" r="45" stroke="#FFE4B5" stroke-width="4" fill="none"/>
  <line x1="40" y1="160" x2="560" y2="160" stroke="#8C6239" stroke-width="6"/>
  <!-- Sofa -->
  <rect x="80" y="240" width="440" height="90" rx="10" fill="#756A5C"/>
  <rect x="100" y="220" width="120" height="50" rx="6" fill="#B3A99B"/>
  <rect x="240" y="220" width="120" height="50" rx="6" fill="#B3A99B"/>
  <rect x="380" y="220" width="120" height="50" rx="6" fill="#8F0B20"/>
  <!-- Table -->
  <ellipse cx="300" cy="345" rx="120" ry="24" fill="#472E1B"/>
  <!-- Floor -->
  <rect x="0" y="360" width="600" height="40" fill="#1C1814"/>
