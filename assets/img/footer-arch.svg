<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none">
  <defs>
    <clipPath id="archClip">
      <path d="M0 150 C0 67, 67 0, 150 0 C233 0, 300 67, 300 150 L300 380 L0 380 Z"/>
    </clipPath>
    <linearGradient id="warmLight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#archClip)">
    <!-- Room Background -->
    <rect width="300" height="380" fill="#201C18"/>
    
    <!-- Floor Lamp -->
    <line x1="80" y1="90" x2="80" y2="340" stroke="#B8860B" stroke-width="3"/>
    <ellipse cx="80" cy="340" rx="20" ry="6" fill="#B8860B"/>
    <path d="M60 110 L100 110 L90 80 L70 80 Z" fill="#FFE0B2"/>
    <polygon points="40,360 120,360 80,110" fill="url(#warmLight)"/>

    <!-- Classic Armchair -->
    <path d="M110 240 C100 250 110 320 130 340 L230 340 C250 320 260 250 250 240 C240 230 220 235 180 235 C140 235 120 230 110 240 Z" fill="#8F0B20"/>
    <rect x="130" y="210" width="100" height="70" rx="14" fill="#C8102E"/>
    <rect x="150" y="245" width="60" height="40" rx="8" fill="#FFE0B2"/>
    <line x1="130" y1="340" x2="120" y2="365" stroke="#422916" stroke-width="4"/>
    <line x1="230" y1="340" x2="240" y2="365" stroke="#422916" stroke-width="4"/>

    <!-- Small Side Table -->
    <ellipse cx="250" cy="310" rx="25" ry="8" fill="#B8860B"/>
    <line x1="250" y1="310" x2="250" y2="360" stroke="#B8860B" stroke-width="3"/>
    <circle cx="250" cy="302" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Arch Outer Border -->
  <path d="M0 150 C0 67, 67 0, 150 0 C233 0, 300 67, 300 150 L300 380 L0 380 Z" stroke="#C8102E" stroke-width="2" fill="none"/>
</svg>