  <rect x="40" y="40" width="520" height="160" fill="#293036" rx="6"/>
  <line x1="40" y1="90" x2="560" y2="90" stroke="#FFD8A8" stroke-width="2"/>
  <line x1="40" y1="140" x2="560" y2="140" stroke="#FFD8A8" stroke-width="2"/>
  <rect x="70" y="55" width="30" height="30" fill="#4B5660"/>
  <rect x="220" y="55" width="40" height="30" fill="#B8860B"/>
  <rect x="440" y="105" width="50" height="30" fill="#C8102E"/>
  <!-- Desk -->
  <rect x="100" y="220" width="400" height="24" rx="4" fill="#3D4750"/>
  <rect x="120" y="244" width="30" height="100" fill="#242B30"/>
  <rect x="450" y="244" width="30" height="100" fill="#242B30"/>
  <!-- Office Chair -->
